name: ScorePilot AI CI

on:
  push:
    branches:
      - main
      - scorepilot-ai-independent
  pull_request:
    branches:
      - main
      - scorepilot-ai-independent

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify Base44 independence
        run: npm run verify:independent

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
